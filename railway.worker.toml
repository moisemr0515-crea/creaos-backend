[build]
builder = "nixpacks"
# Revertido de "npm ci --omit=dev" — ver el comentario en railway.toml
# (mismo bug, mismo fix, worker y API comparten build).
buildCommand = "npm install --production=false"

[deploy]
startCommand = "node worker.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[healthcheck]
path = "/health"
timeout = 10
